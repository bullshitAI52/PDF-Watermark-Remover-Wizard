name: Build Executables

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.2.0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PDF_Watermark_Remover_Pro" --collect-all customtkinter --add-data "gui_app;gui_app" --add-data "core;core" --add-data "utils;utils" launcher.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows-exe
          path: dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build APP
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PDF_Watermark_Remover_Pro" --collect-all customtkinter --add-data "gui_app:gui_app" --add-data "core:core" --add-data "utils:utils" launcher.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: macos-app
          path: dist/*.app
